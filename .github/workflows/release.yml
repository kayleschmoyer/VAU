name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Stamp version in AssemblyInfo
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        # Ensure version has at least 3 parts (major.minor.patch)
        $parts = $version.Split('.')
        while ($parts.Count -lt 3) { $version += ".0"; $parts = $version.Split('.') }
        $assemblyVersion = "$version.0".Split('.')[0..3] -join '.'
        $filePath = "VastAutoUpdater\My Project\AssemblyInfo.vb"
        $content = Get-Content $filePath -Raw
        $content = $content -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(""$assemblyVersion"")"
        $content = $content -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(""$assemblyVersion"")"
        Set-Content $filePath $content -NoNewline
        Write-Host "Stamped version: $assemblyVersion"

    - name: Restore NuGet packages
      run: nuget restore VastAutoUpdater.sln

    - name: Build Release
      run: msbuild VastAutoUpdater.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /verbosity:minimal

    - name: Run Tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find Common7\IDE\Extensions\TestPlatform\vstest.console.exe
        if (-not $vstest) {
          Write-Error "vstest.console.exe not found via vswhere"
          exit 1
        }
        & $vstest VastAutoUpdater.Tests\bin\Release\VastAutoUpdater.Tests.dll /TestAdapterPath:packages\MSTest.TestAdapter.3.1.1\build /Logger:trx
        exit $LASTEXITCODE

    - name: Build installer
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $issPath = "installer\setup.iss"
        $content = Get-Content $issPath -Raw
        $content = $content -replace 'AppVersion=[^\r\n]*', "AppVersion=$version"
        Set-Content $issPath $content -NoNewline
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
        }
        if (-not (Test-Path $iscc)) {
          Write-Error "ISCC.exe not found after install"
          exit 1
        }
        & $iscc $issPath
        exit $LASTEXITCODE

    - name: Prepare release artifacts
      shell: pwsh
      run: |
        $outDir = "release-artifacts"
        New-Item -ItemType Directory -Path $outDir -Force
        Copy-Item "VastAutoUpdater\bin\Release\VastAutoUpdater.exe" "$outDir\"
        Copy-Item "VastAutoUpdater\bin\Release\VastAutoUpdater.exe.config" "$outDir\"
        Copy-Item "VastAutoUpdater\bin\Release\*.dll" "$outDir\"
        Copy-Item "installer\Output\VastAutoUpdater-Setup.exe" "$outDir\"
        # Generate SHA-256 hashes for the executables
        $hash = Get-FileHash "$outDir\VastAutoUpdater.exe" -Algorithm SHA256
        "$($hash.Hash)  VastAutoUpdater.exe" | Out-File "$outDir\VastAutoUpdater.exe.sha256" -Encoding utf8
        $setupHash = Get-FileHash "$outDir\VastAutoUpdater-Setup.exe" -Algorithm SHA256
        "$($setupHash.Hash)  VastAutoUpdater-Setup.exe" | Out-File "$outDir\VastAutoUpdater-Setup.exe.sha256" -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: VAST Updater v${{ steps.version.outputs.VERSION }}
        body: |
          ## VAST Auto Updater v${{ steps.version.outputs.VERSION }}

          ### Artifacts
          - `VastAutoUpdater-Setup.exe` — Installer (recommended)
          - `VastAutoUpdater.exe` — Main updater executable
          - `*.sha256` — SHA-256 hashes for integrity verification

          ### Verification
          ```powershell
          (Get-FileHash VastAutoUpdater-Setup.exe -Algorithm SHA256).Hash
          ```
          Compare with the hash in the matching `.sha256` file.
        files: |
          release-artifacts/VastAutoUpdater-Setup.exe
          release-artifacts/VastAutoUpdater-Setup.exe.sha256
          release-artifacts/VastAutoUpdater.exe
          release-artifacts/VastAutoUpdater.exe.config
          release-artifacts/VastAutoUpdater.exe.sha256
        draft: false
        prerelease: false
