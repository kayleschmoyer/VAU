name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore VastAutoUpdater.sln

    - name: Build Release
      run: msbuild VastAutoUpdater.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /verbosity:minimal

    - name: Run Tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find Common7\IDE\Extensions\TestPlatform\vstest.console.exe
        if (-not $vstest) {
          Write-Error "vstest.console.exe not found via vswhere"
          exit 1
        }
        & $vstest VastAutoUpdater.Tests\bin\Release\VastAutoUpdater.Tests.dll /TestAdapterPath:packages\MSTest.TestAdapter.3.1.1\build /Logger:trx
        exit $LASTEXITCODE
